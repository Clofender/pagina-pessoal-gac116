<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Portfólio pessoal de Daniel Silva Ferraz Neto em duas versões de framework CSS.">
    <title>Daniel Neto | Página Pessoal</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; background: #fafaf9; color: #1c1917; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
        main { width: min(680px, 100%); text-align: center; }
        h1 { margin-bottom: .5rem; font-size: clamp(2rem, 6vw, 3.5rem); }
        p { color: #57534e; line-height: 1.6; }
        .options { display: grid; gap: 1rem; margin-top: 2rem; text-align: left; }
        a { display: block; padding: 1.25rem; border: 1px solid #d6d3d1; border-radius: .5rem; color: inherit; text-decoration: none; background: #fff; transition: transform .16s, border-color .16s; }
        a:hover { transform: translateY(-3px); border-color: #c1121f; }
        strong { display: block; margin-bottom: .35rem; color: #a30f1a; }
        small { color: #78716c; }
    </style>
</head>

<body>
    <main>
        <p>GAC116 | Programação Web</p>
        <h1>Daniel Silva Ferraz Neto</h1>
        <p>Escolha uma versão do meu portfólio pessoal para conhecer minha trajetória, habilidades e projetos.</p>
        <div class="options">
            <a href="code/"><strong>Versão Bootstrap</strong><small>Interface construída com Bootstrap 5.3.</small></a>
            <a href="page/"><strong>Versão Tailwind CSS</strong><small>O mesmo conteúdo com Tailwind CSS e JavaScript.</small></a>
        </div>
    </main>
</body>

</html>
